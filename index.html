/* ---------- constants ---------- */
var KEY='enoogh_v1';
var WD=['周日','周一','周二','周三','周四','周五','周六'];
var CYCLE_DAYS=28;
var CHARITIES=[
  {id:'amaze',name:'Amaze（维州孤独症协会）',d:'为孤独症人士和家庭提供信息、咨询，推动社会接纳',url:'https://www.amaze.org.au'},
  {id:'aspect',name:'Aspect（澳洲孤独症谱系协会）',d:'为孤独症儿童提供早期干预和专门学校服务',url:'https://www.aspect.org.au'}
];
var LOGO='<svg class="logo" width="34" height="34" viewBox="0 0 120 120" aria-hidden="true"><path d="M99.5 45.6 A42 42 0 1 1 74.4 20.5" fill="none" stroke="#4AA3E0" stroke-width="10" stroke-linecap="round"/><path d="M40 60 L56 76 L104 24" fill="none" stroke="#0E9C8C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var LOGO_W='<svg width="52" height="52" viewBox="0 0 120 120" aria-hidden="true"><path d="M99.5 45.6 A42 42 0 1 1 74.4 20.5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="10" stroke-linecap="round"/><path d="M40 60 L56 76 L104 24" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var TICK='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* PTE task library: minutes per item are rough estimates for the plan-size warning */
var PTE={
  DI:{n:'Describe Image',u:'题',m:1.2,tip:'先概括图是什么，再说 2–3 个重点，最后一句说结论或趋势。内容分想过 1 分，必须说出关系和结论。'},
  SGD:{n:'Summarize Group Discussion',u:'题',m:4,tip:'笔记分三栏记三个人的观点；三个人都要说到，再点出他们哪里同意、哪里不同。不用说满 2 分钟。'},
  RS:{n:'Repeat Sentence',u:'题',m:0.35,tip:'不记笔记，听完马上跟。说得顺比说得全更重要，忘了几个词也别停。'},
  SWT:{n:'Summarize Written Text',u:'题',m:8,tip:'只写一句话，20–35 词最好，最多 75 词。用复合句把主要意思串起来。'},
  WE:{n:'Write Essay',u:'篇',m:20,tip:'20 分钟、200–300 词。写完留 2 分钟只查拼写和语法。'},
  FIBD:{n:'Fill in the Blanks（下拉）',u:'题',m:1,tip:'阅读分 25% 来自这里。错题整理成固定搭配，第二天复习。'},
  RL:{n:'Retell Lecture',u:'题',m:2,tip:'只记关键词，不写句子。复述时先说主题，再说 2–3 个要点。'},
  RTS:{n:'Respond to a Situation',u:'题',m:1,tip:'想象你就在场，用“I”说。一开口先说你的请求，用 Could I… / Would I be able to…'},
  FIBDD:{n:'Fill in the Blanks（拖拽）',u:'题',m:1,tip:'先通读一遍抓大意，再看空格前后的词性。'},
  WFD:{n:'Write from Dictation',u:'题',m:0.5,tip:'每个拼对的词得 1 分。错词记本子，第二天重默。'},
  RA:{n:'Read Aloud',u:'题',m:0.8,tip:'只占总分 4%，按意群断句，说完再停，别拖到进度条最后。'},
  HIW:{n:'Highlight Incorrect Words',u:'题',m:1,tip:'眼睛跟着音频走，听到和文字不一样的词就点。'}
};
var PTE_WEIGHTS=[['Describe Image',15],['Summarize Group Discussion',9],['Repeat Sentence',7],['Summarize Written Text',7],['Write Essay',7],['Fill in the Blanks（下拉）',7],['Retell Lecture',6],['Respond to a Situation',6],['Fill in the Blanks（拖拽）',6],['Write from Dictation',5],['Read Aloud',4]];
var PTE_TEMPLATES={
  speaking:{label:'口语',tasks:[['DI',8],['RS',20],['RTS',2],['SGD',2]]},
  writing:{label:'写作',tasks:[['WFD',15],['SWT',1],['DI',4],['RS',10]]},
  reading:{label:'阅读',tasks:[['FIBD',10],['FIBDD',8],['RS',10],['DI',4]]},
  listening:{label:'听力',tasks:[['WFD',15],['RS',20],['SGD',2],['HIW',5]]}
};
var GENERAL_TIPS=['把任务放在固定时间、固定地点做，减少每天的决定。','先做 2 分钟：打开就开始，往往就停不下来了。','前一天晚上把要用的东西准备好。','漏了一天不要紧，最重要的是不要连续漏两天。','完成后马上打卡，别等到睡前。'];

/* ---------- state ---------- */
var S=load();
function blank(){return {v:1,offset:0,goal:null,draft:null,ui:{tab:'today'},history:[]};}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return s;}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('手机存储空间不够，部分照片可能没保存');}}

/* ---------- dates (local, with demo offset) ---------- */
function realToday(){var d=new Date();d.setHours(0,0,0,0);return d;}
function today(){return addDays(realToday(),S.offset);}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function pad(n){return n<10?'0'+n:''+n;}
function diffDays(a,b){return Math.round((b-a)/864e5);}
function fmt(d){return (d.getMonth()+1)+'月'+d.getDate()+'日';}  // 中文日期，避免 D/M 与 M/D 混淆
function fmtLong(d){return fmt(d)+' '+WD[d.getDay()];}
function money(n){return '$'+(Math.round(n*100)/100).toLocaleString('en-AU',{minimumFractionDigits:0,maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------- goal model ---------- */
function planFor(goal,d){ // plan in force on date d
  var w=weekIndex(goal,d); var p=goal.plans[0].plan;
  for(var i=0;i<goal.plans.length;i++){if(goal.plans[i].fromWeek<=w)p=goal.plans[i].plan;}
  return p;
}
function weekIndex(goal,d){return Math.floor(diffDays(fromKey(goal.start),d)/7);}
function isPracticeDay(goal,d){var p=planFor(goal,d);return p.days.indexOf(d.getDay())>=0;}
function cycleEnd(goal){return addDays(fromKey(goal.start),CYCLE_DAYS-1);}
function inCycle(goal,d){var i=diffDays(fromKey(goal.start),d);return i>=0&&i<CYCLE_DAYS;}
function rec(goal,k){return goal.days[k]||(goal.days[k]={});}
function dayStatus(goal,d){
  var k=key(d), t=today();
  if(!inCycle(goal,d))return 'out';
  if(!isPracticeDay(goal,d))return 'rest';
  var r=goal.days[k]||{};
  if(r.done)return 'done';
  if(r.excused)return 'excused';
  if(diffDays(d,t)>0)return 'miss';
  if(diffDays(d,t)===0)return 'todo';
  return 'future';
}
function perMiss(goal){return goal.stake/20;}
function practiceDaysTotal(goal){var n=0;for(var i=0;i<CYCLE_DAYS;i++){if(isPracticeDay(goal,addDays(fromKey(goal.start),i)))n++;}return n;}

/* settle: misses become pending deductions; pending older than 24h are charged on Sundays (weekly batch) */
function settle(){
  var g=S.goal; if(!g||g.finished)return;
  var t=today(), start=fromKey(g.start);
  for(var i=0;i<CYCLE_DAYS;i++){
    var d=addDays(start,i); if(diffDays(d,t)<=0)break;
    if(dayStatus(g,d)==='miss'){
      var k=key(d); if(!g.ledger.some(function(l){return l.day===k;})){
        var already=g.ledger.reduce(function(s,l){return s+(l.status==='void'?0:l.amt);},0);
        var amt=Math.max(0,Math.min(perMiss(g),g.stake-already));
        g.ledger.push({day:k,amt:amt,status:amt>0?'pending':'void',noticed:key(addDays(d,1))});
      }
    }
  }
  // weekly batch on Sunday: charge pending items whose 24h notice has passed
  g.ledger.forEach(function(l){
    if(l.status!=='pending')return;
    var nd=fromKey(l.noticed), due=nextSunday(addDays(nd,1));
    if(diffDays(due,t)>=0){l.status='charged';l.chargedOn=key(due);}
  });
  if(diffDays(cycleEnd(g),t)>0 && !g.finished){
    // final settlement: everything pending is charged at the end
    g.ledger.forEach(function(l){if(l.status==='pending'){l.status='charged';l.chargedOn=key(addDays(cycleEnd(g),1));}});
    g.finished=key(addDays(cycleEnd(g),1));
  }
  save();
}
function nextSunday(d){var x=new Date(d.getTime());while(x.getDay()!==0)x=addDays(x,1);return x;}
function totals(g){
  var charged=0,pending=0;
  g.ledger.forEach(function(l){if(l.status==='charged')charged+=l.amt;if(l.status==='pending')pending+=l.amt;});
  return {charged:charged,pending:pending,left:Math.max(0,g.stake-charged-pending)};
}
function appealsLeft(g){return g.mode==='hard'?0:Math.max(0,2-g.appealsUsed);}

/* ---------- ui helpers ---------- */
var $app=document.getElementById('app');
function toast(msg){document.querySelectorAll('.toast').forEach(function(x){x.remove();});var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function sheet(html,onMount){
  var bg=document.createElement('div');bg.className='sheet-bg';
  bg.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  bg.addEventListener('click',function(e){if(e.target===bg)close();});
  function close(){bg.remove();}
  document.body.appendChild(bg); if(onMount)onMount(bg.firstChild,close); return close;
}
function on(sel,ev,fn,root){(root||$app).querySelectorAll(sel).forEach(function(el){el.addEventListener(ev,fn);});}
function top(){

function nextDraft(old,rate){ // 再开一期：带上上一期计划；完成率 <80% 时按建议调轻
  var D=newDraft(),p=old.plans[old.plans.length-1].plan,light=rate<80;
  D.step=2;D.type=old.type;D.goalName=old.type==='pte'?'':old.name;
  if(old.pte){D.pte=JSON.parse(JSON.stringify(old.pte));if(D.pte.exam<key(addDays(today(),7)))D.pte.exam=key(addDays(today(),42));}
  D.days=p.days.slice();if(light&&D.days.length>3)D.days=D.days.slice(0,Math.max(3,D.days.length-2));
  D.time=p.time;D.tasks=p.tasks.map(function(t){var c={code:t.code||null,name:t.name,qty:light?Math.max(1,Math.round(t.qty/2)):t.qty,unit:t.unit,mins:t.mins||0};if(!c.code)delete c.code;return c;});
  D.stake=old.stake;D.mode=old.mode;D.pay=old.pay;D.charity=old.charity;D.carried=light?'light':'same';

}

  on('[data-tmins]','change',function(){D.tasks[+this.getAttribute('data-tmins')].mins=Math.max(0,+this.value||0);save();render();});
  on('[data-stake]','click',function(){D.stake=+this.getAttribute('data-stake');save();render();});

  on('[data-pay]','click',function(){D.pay=this.getAttribute('data-pay');save();render();});
  on('[data-charity]','click',function(){D.charity=this.getAttribute('data-charity');save();render();});
  on('[data-agree]','click',function(){var i=this.getAttribute('data-agree');D.agree[i]=!D.agree[i];save();render();});
  on('#startGoal','click',function(){
    var plan={days:D.days.slice(),time:D.time,tasks:D.tasks.map(function(t){return {code:t.code||null,name:t.name,qty:t.qty,unit:t.unit,mins:t.mins||0};})};

function renderTabs(){
  var g=S.goal, el=document.getElementById('tabs'); el.classList.remove('hide');
  document.getElementById('tabsIn').innerHTML=TABDEF.map(function(t){var label=t[0]==='learn'&&g.type!=='pte'?'技巧':t[1];return '<button class="tab '+(S.ui.tab===t[0]?'on':'')+'" data-tab="'+t[0]+'" aria-current="'+(S.ui.tab===t[0]?'page':'false')+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+t[2]+'</svg>'+label+'</button>';}).join('');

function render(){
  if(!S.goal){renderOnboard();return;}
  settle();
  if(S.goal.finished){renderFinished();return;}
  var t=S.ui.tab, h=top();
  if(t==='today')h+=viewToday();
  else if(t==='plan')h+=viewPlan();
  else if(t==='money')h+=viewMoney();
  else h+=viewLearn();
  $app.innerHTML=h; bindTop(); renderTabs();
  if(t==='today')bindToday();
  if(t==='plan')bindPlan();
  if(t==='money')bindMoney();
}

/* today */
function dailyTip(g,d){
  if(g.type==='pte'){var p=planFor(g,d), codes=p.tasks.filter(function(x){return x.code;}); if(codes.length){var c=codes[diffDays(fromKey(g.start),d)%codes.length].code;return '<b>'+PTE[c].n+'：</b>'+PTE[c].tip;}}
  return GENERAL_TIPS[Math.abs(diffDays(fromKey(g.start),d))%GENERAL_TIPS.length];
}
function weekStrip(g){
  var t=today(), mon=addDays(t,-((t.getDay()+6)%7)), h='<div class="week">';
  for(var i=0;i<7;i++){
    var d=addDays(mon,i), st=dayStatus(g,d), cls={done:'done',miss:'miss',excused:'excused',rest:'rest',out:'out'}[st]||'';
    var icon={done:'✓',miss:'✕',excused:'假',rest:'休',todo:'·',future:'',out:''}[st];
    h+='<div class="day '+cls+(diffDays(d,t)===0?' today':'')+'" aria-label="'+WD[d.getDay()]+' '+({done:'完成',miss:'漏练',excused:'已申诉',rest:'休息',todo:'今天',future:'',out:'不在本期'}[st]||'')+'">'+WD[d.getDay()].slice(1)+'<b>'+icon+'</b></div>';
  }
  return h+'</div>';
}
function cycleStats(g){
  var t=today(),start=fromKey(g.start),done=0,due=0;
  for(var i=0;i<CYCLE_DAYS;i++){var d=addDays(start,i);if(diffDays(d,t)<0)break;var st=dayStatus(g,d);if(st==='done'||st==='excused'){done++;due++;}else if(st==='miss'){due++;}else if(st==='todo'){due+=0;}}
  return {done:done,due:due,day:diffDays(start,t)+1};
}
function viewToday(){
  var g=S.goal, t=today(), k=key(t), r=rec(g,k), st=dayStatus(g,t), p=planFor(g,t), T=totals(g), cs=cycleStats(g);
  var rate=cs.due?Math.round(cs.done/cs.due*100):100, C=2*Math.PI*40;
  var h='<div class="card"><div class="row"><div class="ring"><svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40" fill="none" stroke="#E4EEEC" stroke-width="9"/><circle cx="48" cy="48" r="40" fill="none" stroke="'+(cs.due?'#0E9C8C':'none')+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(cs.due?C*rate/100:0)+' '+C+'"/></svg><div class="c">'+(cs.due?'<b>'+rate+'%</b><span>完成率</span>':'<b style="font-size:17px">第 '+Math.max(1,cs.day)+' 天</b><span>刚起步</span>')+'</div></div>'+
  '<div style="flex:1"><div class="small muted">'+esc(g.name)+(g.pte?' · '+g.pte.now+' → '+g.pte.target:'')+'</div><div style="font-size:20px;font-weight:800;margin:2px 0">第 '+cs.day+' / '+CYCLE_DAYS+' 天</div>'+
  '<div class="small muted">承诺金还剩 <b style="color:var(--ink)">'+money(T.left)+'</b> / '+money(g.stake)+'</div>'+(g.pte&&g.pte.exam?'<div class="small muted">距离考试 '+Math.max(0,diffDays(t,fromKey(g.pte.exam)))+' 天</div>':'')+'</div></div>'+weekStrip(g)+'</div>';
  var justCard='';
  var just=g.ledger.filter(function(l){if(l.status!=='charged'||!l.chargedOn)return false;var a=diffDays(fromKey(l.chargedOn),t);return a>=0&&a<7;});
  if(just.length){var jd=fromKey(just[0].chargedOn);
    justCard='<div class="card" style="background:var(--sky-tint);border-color:#CFE5F6;box-shadow:none"><b>'+(diffDays(jd,t)===0?'今天':fmt(jd)+' 周日 ')+'已合并扣款 '+money(just.reduce(function(s,l){return s+l.amt;},0))+'</b><p class="small" style="margin:6px 0 0">'+just.length+' 天漏练，这笔钱已全部捐给 '+esc(charityName(g))+'。过去的就过去了，新的一周从今天重新开始。</p></div>';}
  // 已扣款通知只是告知：今天还要打卡时放到最下面，别把打卡挤出首屏
  if(st==='rest'||st==='done'||st==='excused'){h+=justCard;justCard='';}
  var pend=g.ledger.filter(function(l){return l.status==='pending';});
  if(pend.length){
    var due=nextSunday(addDays(fromKey(pend[0].noticed),1));
    h+='<div class="card badc"><div class="row between"><b>有 '+pend.length+' 天漏练，将扣 '+money(pend.reduce(function(s,l){return s+l.amt;},0))+'</b><span class="chip bad">待扣款</span></div><p class="small" style="margin:6px 0 10px">将在 '+fmtLong(due)+' 合并扣款并捐出。'+(pend.some(function(l){return fromKey(l.noticed).getDay()===0;})?'周六的漏练周日才通知你，按规定要满 24 小时才扣，所以顺延到下周日。':'')+(appealsLeft(g)?'如果是生病或急事，现在还可以申诉。':(g.mode==='hard'?'硬核模式不能申诉。':'本期申诉次数已用完。'))+'</p>'+
    (appealsLeft(g)?'<button class="btn small danger" id="appealPending">'+(pend.length>1?'选一天申诉':'申诉')+'（剩 '+appealsLeft(g)+' 次）</button>':'')+'</div>';
  }
  if(st==='rest'){
    h+='<div class="card tint"><h2>今天休息 🌿</h2><p class="muted" style="margin:0">'+(t.getDay()===0?'今天周日，可以去「计划」看本周复盘、调整下周计划。':'好好休息，明天继续。')+'</p>'+(function(){for(var i=1;i<=7;i++){var nd=addDays(t,i),np=planFor(g,nd);if(np.days.indexOf(nd.getDay())>=0&&np.tasks.length){return '<div class="small" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><b>'+(i===1?'明天':'周'+'日一二三四五六'[nd.getDay()])+' '+esc(np.time)+' 要做：</b><br>'+np.tasks.map(function(x){return esc(x.name)+' '+x.qty+esc(x.unit);}).join('<br>')+'</div>';}}return '';})()+'</div>';
  } else if(st==='done'){
    h+='<div class="card tint"><h2>今天完成了 ✓</h2><p class="muted" style="margin:0">打卡时间 '+esc(r.doneAt||'')+'。明天 '+p.time+' 提醒你。</p></div>'+proofView(r);
  } else if(st==='excused'){
    h+='<div class="card"><h2>今天已报备</h2><p class="muted" style="margin:0">原因：'+esc(r.reason||'')+'。今天不扣钱。</p></div>';
  } else {
    var all=p.tasks.every(function(x,i){return r.tasks&&r.tasks[i];}), proofOk=(r.photos&&r.photos.length)&&(g.type!=='pte'||r.audio);
    h+='<div class="card"><div class="row between"><h2 style="margin:0">今天的任务</h2><span class="chip sky">'+p.time+' 提醒 · 23:59 截止</span></div><div style="margin-top:6px">'+
    p.tasks.map(function(x,i){var on=r.tasks&&r.tasks[i];return '<div class="task"><button class="check '+(on?'on':'')+'" data-tick="'+i+'" role="checkbox" aria-checked="'+!!on+'" aria-label="完成 '+esc(x.name)+'">'+TICK+'</button><div class="nm"><div class="t">'+esc(x.name)+'</div><div class="d">'+x.qty+' '+esc(x.unit)+'</div></div></div>';}).join('')+'</div></div>';
    h+='<div class="card tint"><div class="tip"><div class="ic">💡</div><div class="small">'+dailyTip(g,t)+'</div></div></div>';
    h+='<div class="card"><h2>交打卡证据</h2><p class="small muted">'+(g.type==='pte'?'① 练习 App 当天记录截图（能看到日期和题量）② 一段 30 秒左右的口语录音。':'一张能证明完成的照片或截图。')+'</p>'+
    '<div class="proof">'+(r.photos||[]).map(function(src,i){return '<img class="thumb" src="'+src+'" alt="打卡截图 '+(i+1)+'">';}).join('')+'<button class="upl" id="addPhoto" aria-label="上传截图或照片"><span style="font-size:22px">＋</span>截图/照片</button></div>';
    if(g.type==='pte'){
      h+='<div style="margin-top:14px"><div class="rec" id="recBox">'+(r.audio?'<audio controls src="'+r.audio+'" style="max-width:100%"></audio><button class="btn small ghost" id="recAgain">重录</button>':'<button class="btn small soft" id="recStart">🎙 开始录音（30 秒）</button><button class="btn small ghost" id="audioFile">上传录音文件</button>')+'</div></div>';
    }
    h+='<button class="btn primary block" style="margin-top:16px" id="submitDay" '+(all&&proofOk?'':'disabled')+'>打卡完成</button>'+
    '<p class="small muted" style="margin:8px 0 0;text-align:center">'+(all?'':'先把任务全部勾上。')+(proofOk?'':(all?'':' ')+'再交证据。')+'</p></div>';
    if(g.mode!=='hard')h+='<button class="btn ghost block" id="excuseToday">今天生病/有急事？报备（剩 '+appealsLeft(g)+' 次）</button>';
  }
  h+=justCard;
  return h;
}
function proofView(r){
  if(!(r.photos&&r.photos.length)&&!r.audio)return '';
  return '<div class="card"><h3>今天的证据</h3><div class="proof">'+(r.photos||[]).map(function(src){return '<img class="thumb" src="'+src+'" alt="打卡截图">';}).join('')+'</div>'+(r.audio?'<audio controls src="'+r.audio+'" style="margin-top:10px;max-width:100%"></audio>':'')+'</div>';
}
var recState=null;
function bindToday(){
  var g=S.goal, k=key(today()), r=rec(g,k);
  on('[data-tick]','click',function(){var i=this.getAttribute('data-tick');r.tasks=r.tasks||{};r.tasks[i]=!r.tasks[i];save();render();});
  on('#addPhoto','click',function(){pickFile('filePhoto',function(f){compressImage(f,function(url){r.photos=(r.photos||[]).concat([url]).slice(-4);save();render();});});});
  on('#audioFile','click',function(){pickFile('fileAudio',function(f){if(f.size>3e6){toast('录音文件太大，请录 30 秒左右');return;}var fr=new FileReader();fr.onload=function(){r.audio=fr.result;save();render();};fr.readAsDataURL(f);});});
  on('#recAgain','click',function(){r.audio=null;save();render();});
  on('#recStart','click',startRec);
  on('#submitDay','click',function(){
    var now=new Date();r.done=true;r.doneAt=pad(now.getHours())+':'+pad(now.getMinutes());save();render();toast('打卡成功！承诺金一分没少 👏');
  });
  on('#excuseToday','click',function(){appealSheet('today',k);});
  on('#appealPending','click',function(){appealSheet('pending',appealDays(g)[0].day);});
}
function pickFile(id,cb){var el=document.getElementById(id);el.value='';el.onchange=function(){if(el.files&&el.files[0])cb(el.files[0]);};el.click();}
function compressImage(file,cb){
  var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){var m=480,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7));};img.onerror=function(){toast('这张图片打不开，换一张试试');};img.src=fr.result;};fr.readAsDataURL(file);
}
function startRec(){
  var box=document.getElementById('recBox');
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){toast('这里不能直接录音，请用“上传录音文件”');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var chunks=[],mr=new MediaRecorder(stream),left=30;
    mr.ondataavailable=function(e){if(e.data.size)chunks.push(e.data);};
    mr.onstop=function(){stream.getTracks().forEach(function(t){t.stop();});clearInterval(recState&&recState.iv);recState=null;var b=new Blob(chunks,{type:mr.mimeType||'audio/webm'});var fr=new FileReader();fr.onload=function(){var r=rec(S.goal,key(today()));r.audio=fr.result;save();render();toast('录好了');};fr.readAsDataURL(b);};
    mr.start();
    box.innerHTML='<span class="dot" aria-hidden="true"></span><b id="recLeft">30</b><span class="small muted">秒</span><button class="btn small primary" id="recStop">录好了</button>';
    recState={iv:setInterval(function(){left--;var el=document.getElementById('recLeft');if(el)el.textContent=left;if(left<=0&&mr.state==='recording')mr.stop();},1000)};
    document.getElementById('recStop').onclick=function(){if(mr.state==='recording')mr.stop();};
  }).catch(function(){toast('没有麦克风权限，请用“上传录音文件”');});
}
function appealSheet(kind,dayKey){
  var g=S.goal;
  var opts=kind==='pending'?appealDays(g):[];
  var pick=opts.length>1?'<div class="field"><label class="f">申诉哪一天</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+opts.map(function(l){var d=fromKey(l.day);return '<button type="button" class="opt apd'+(l.day===dayKey?' on':'')+'" data-day="'+l.day+'" style="padding:10px 6px;text-align:center"><div class="t">'+WD[d.getDay()]+'</div><div class="d">'+fmt(d)+' · '+money(l.amt)+'</div></button>';}).join('')+'</div></div>':'';
  sheet('<h2 id="apTitle">'+(kind==='today'?'今天报备':opts.length>1?'申诉一天漏练':'申诉 '+fmt(fromKey(dayKey))+' 的漏练')+'</h2><p class="small muted">本期还剩 '+appealsLeft(g)+' 次，每次申诉一天。正式版由真人审核，通常几小时内回复。</p>'+pick+
  '<div class="field"><label class="f" for="reason">原因</label><textarea class="in" id="reason" placeholder="比如：发烧去看医生了"></textarea></div>'+
  '<div class="row"><button class="btn ghost" data-close>取消</button><button class="btn primary" style="flex:1" id="sendAppeal">提交</button></div>',function(el,close){
    el.querySelector('[data-close]').onclick=close;
    Array.prototype.forEach.call(el.querySelectorAll('.apd'),function(b){b.onclick=function(){dayKey=b.dataset.day;Array.prototype.forEach.call(el.querySelectorAll('.apd'),function(x){x.classList.toggle('on',x===b);});};});
    el.querySelector('#sendAppeal').onclick=function(){
      var v=el.querySelector('#reason').value.trim(); if(v.length<2){toast('写一句原因');return;}
      var r=rec(g,dayKey); r.excused=true; r.reason=v; g.appealsUsed++;
      g.ledger.forEach(function(l){if(l.day===dayKey&&l.status==='pending')l.status='void';});
      save(); close(); render(); toast(kind==='today'?'已报备，今天不扣钱':'申诉通过（演示），这笔不扣了');
    };
  });
}

/* plan */
function viewPlan(){
  var g=S.goal,t=today(),w=weekIndex(g,t),cur=planFor(g,t),next=g.plans.filter(function(p){return p.fromWeek>w;})[0];
  var h='<h1>计划</h1>';
  // weekly review on Saturday/Sunday or any time: this week's numbers
  var mon=addDays(t,-((t.getDay()+6)%7)),done=0,miss=0,ex=0;
  for(var i=0;i<7;i++){var d=addDays(mon,i);if(diffDays(d,t)<0)break;var st=dayStatus(g,d);if(st==='done')done++;if(st==='miss')miss++;if(st==='excused')ex++;}
  var isReview=t.getDay()===6||t.getDay()===0;
  h+='<div class="card'+(isReview?' tint':'')+'"><div class="row between"><h2 style="margin:0">本周复盘</h2>'+(isReview?'<span class="chip brand">周末复盘时间</span>':'<span class="chip grey">周六晚复盘</span>')+'</div>'+
  '<div class="grid3" style="margin-top:12px;text-align:center"><div><div class="money" style="font-size:24px">'+done+'</div><div class="small muted">完成</div></div><div><div class="money" style="font-size:24px;color:var(--bad)">'+miss+'</div><div class="small muted">漏练</div></div><div><div class="money" style="font-size:24px;color:#1D6FA8">'+ex+'</div><div class="small muted">申诉/报备</div></div></div>'+
  (miss?'<p class="small" style="margin:12px 0 0">漏练的那天，是计划太满，还是时间不对？在下面改下周计划。</p>':'<p class="small muted" style="margin:12px 0 0">'+(done?'保持住。如果太轻松，下周可以加一点量。':'本周刚开始。')+'</p>')+'</div>';
  h+='<div class="card"><div class="row between"><h2 style="margin:0">本周计划</h2><span class="chip grey">第 '+(w+1)+' 周</span></div>'+planTable(cur)+'</div>';
  h+='<div class="card"><div class="row between"><h2 style="margin:0">下周计划</h2>'+(next?'<span class="chip brand">已修改，下周生效</span>':'<span class="chip grey">和本周一样</span>')+'</div>'+
  (next?planTable(next.plan):'<p class="small muted" style="margin:8px 0 0">改计划只在下周生效。这样就不会出现“今天累了，临时少练点”。</p>')+
  '<button class="btn soft block" style="margin-top:12px" id="editNext">修改下周计划</button></div>';
  return h;
}
function planTable(p){
  return '<div class="small muted" style="margin:6px 0">'+[1,2,3,4,5,6,0].filter(function(d){return p.days.indexOf(d)>=0;}).map(function(d){return WD[d];}).join(' ')+' · '+p.time+' 提醒 · 约 '+estMinutes(p.tasks)+' 分钟/天</div>'+
  p.tasks.map(function(x){return '<div class="kv"><span>'+esc(x.name)+'</span><b>'+x.qty+' '+esc(x.unit)+'</b></div>';}).join('');
}
function bindPlan(){
  on('#editNext','click',function(){
    var g=S.goal,w=weekIndex(g,today()),base=JSON.parse(JSON.stringify((g.plans.filter(function(p){return p.fromWeek>w;})[0]||{plan:planFor(g,today())}).plan));
    function body(){
      return '<h2>修改下周计划</h2><p class="small muted">从下周（第 '+(w+2)+' 周）开始生效。</p>'+
      base.tasks.map(function(x,i){return '<div class="task"><div class="nm"><div class="t">'+esc(x.name)+'</div></div><div class="qty"><input class="in" data-eq="'+i+'" type="number" inputmode="numeric" min="0" value="'+x.qty+'" aria-label="'+esc(x.name)+' 数量"><span class="small muted">'+esc(x.unit)+'</span></div></div>';}).join('')+
      '<p class="small muted">数量填 0 = 下周去掉这一项。</p><div class="field"><label class="f" for="eTime">提醒时间</label><input class="in" id="eTime" type="time" value="'+base.time+'"></div>'+
      '<div id="eWarn"></div><div class="row"><button class="btn ghost" data-close>取消</button><button class="btn primary" style="flex:1" id="eSave">保存</button></div>';
    }
    sheet(body(),function(el,close){
      el.querySelector('[data-close]').onclick=close;
      function warn(){var m=estMinutes(base.tasks.filter(function(x){return x.qty>0;}));el.querySelector('#eWarn').innerHTML=m>60?'<div class="card warnc small">估计每天约 '+m+' 分钟，可能太满了。</div>':'<p class="small muted">估计每天约 '+m+' 分钟</p>';}
      warn();
      el.querySelectorAll('[data-eq]').forEach(function(inp){inp.oninput=function(){base.tasks[+inp.getAttribute('data-eq')].qty=Math.max(0,+inp.value||0);warn();};});
      el.querySelector('#eSave').onclick=function(){
        base.time=el.querySelector('#eTime').value||base.time; base.tasks=base.tasks.filter(function(x){return x.qty>0;});
        if(!base.tasks.length){toast('至少留一项任务');return;}
        g.plans=g.plans.filter(function(p){return p.fromWeek<=w;}); g.plans.push({fromWeek:w+1,plan:base}); save(); close(); render(); toast('已保存，下周生效');
      };
    });
  });
}

/* money */
function viewMoney(){
  var g=S.goal,T=totals(g),ch=CHARITIES.filter(function(c){return c.id===g.charity;})[0]||CHARITIES[0];
  var h='<h1>承诺金</h1><div class="card"><div class="small muted">还在你这边的承诺金</div><div class="money">'+money(T.left)+'</div><div class="bar" style="margin:10px 0 4px" aria-hidden="true"><i style="width:'+(T.left/g.stake*100)+'%"></i></div><div class="small muted">共 '+money(g.stake)+' · 漏一天扣 '+money(perMiss(g))+'</div></div>';
  h+='<div class="card"><div class="kv"><span>付款方式</span><b>'+(g.pay==='card'?'绑卡，漏练才扣':'预付承诺金')+'</b></div>'+
  '<div class="kv"><span>模式</span><b>'+(g.mode==='hard'?'硬核':'普通 · 剩 '+appealsLeft(g)+' 次申诉')+'</b></div>'+
  '<div class="kv"><span>已扣（将捐出）</span><b>'+money(T.charged)+'</b></div><div class="kv"><span>待扣（可申诉）</span><b>'+money(T.pending)+'</b></div>'+
  '<div class="kv"><span>捐给</span><b>'+ch.name+'</b></div><div class="kv"><span>服务费（我们的收入）</span><b>'+money(g.fee)+'</b></div></div>';
  h+='<div class="card"><h2>扣款记录</h2>'+(g.ledger.filter(function(l){return l.status!=='void';}).length?g.ledger.filter(function(l){return l.status!=='void';}).slice().reverse().map(function(l){return '<div class="kv"><span>'+fmtLong(fromKey(l.day))+' 漏练</span><b>'+money(l.amt)+' <span class="chip '+(l.status==='charged'?'grey':'bad')+'">'+(l.status==='charged'?'已扣 '+fmt(fromKey(l.chargedOn)):'待扣')+'</span></b></div>';}).join(''):'<p class="small muted" style="margin:0">还没有扣过钱。保持住！</p>')+'</div>';
  h+='<div class="card tint small"><b>钱去哪了？</b>扣下的钱每月汇总一次，100% 捐给你选的机构，收据会发给你。我们只收服务费，所以我们最希望的是你做到。</div>';
  h+='<button class="btn danger block" id="resetAll">删除这一期（演示用）</button>';
  return h;
}
function bindMoney(){on('#resetAll','click',function(){var b=this;if(!b.dataset.sure){b.dataset.sure='1';b.textContent='再点一次确认删除';return;}S=blank();save();render();toast('已清空，重新开始');});}

/* learn */
function viewLearn(){
  var g=S.goal;
  if(g.type!=='pte'){return '<h1>坚持技巧</h1>'+GENERAL_TIPS.map(function(x){return '<div class="card"><div class="tip"><div class="ic">💡</div><div>'+x+'</div></div></div>';}).join('');}
  var max=15;
  var h='<h1>提分</h1><div class="card"><h2>时间先花在哪</h2><p class="small muted">各题型占总分的平均比重（Pearson 官方权重表，2025 年 7 月）。只用来排优先级，不能用来算分。</p>'+
  PTE_WEIGHTS.map(function(w,i){return '<div class="wbar"><span>'+w[0]+'</span><div class="b '+(i===0?'hot':'')+'" style="width:'+(w[1]/max*100)+'%"></div><b>'+w[1]+'%</b></div>';}).join('')+'</div>';
  h+='<div class="card"><h2>各题型技巧</h2>'+Object.keys(PTE).map(function(k){return '<div class="kv" style="display:block"><b>'+PTE[k].n+'</b><div class="small muted" style="margin-top:4px">'+PTE[k].tip+'</div></div>';}).join('')+'</div>';
  h+='<div class="card"><h2>官方免费资料</h2>'+
  '<div class="kv" style="display:block"><a href="https://www.pearsonpte.com/preparation/official-practice-tests" target="_blank" rel="noopener"><b>myPTE Smart Prep</b></a><div class="small muted">免费：学习计划、4 套指导练习卷、视频课、技巧文档</div></div>'+
  '<div class="kv" style="display:block"><a href="https://www.pearsonpte.com/content/dam/ELL/pte/pearsonpte/pdfs/pte-academic-pdfs/pte-academic-speaking-test-tips.pdf" target="_blank" rel="noopener"><b>官方口语技巧 PDF</b></a><div class="small muted">7 个口语题型，含好/中/差示范</div></div>'+
  '<div class="kv" style="display:block"><a href="https://www.pearsonpte.com/content/dam/ELL/pte/pearsonpte/articles/Test-Tips-NewSpeakingQuestions.pdf" target="_blank" rel="noopener"><b>新题型技巧 PDF</b></a><div class="small muted">2025 年 8 月新增的两个口语题</div></div>'+
  '<div class="kv" style="display:block"><a href="https://www.pearsonpte.com/pte-academic/preparation.html" target="_blank" rel="noopener"><b>官方付费模考</b></a><div class="small muted">考前 2–3 周做一次，最接近真实分数</div></div></div>';
  return h;
}

/* finished */
function charityName(g){var c=CHARITIES.filter(function(x){return x.id===g.charity;})[0]||CHARITIES[0];return c.name;}
function renderFinished(){
  var g=S.goal,T=totals(g),start=fromKey(g.start),done=0,due=0,run=0,best=0;
  for(var i=0;i<CYCLE_DAYS;i++){var st=dayStatus(g,addDays(start,i));if(st==='done'||st==='excused'){done++;due++;run++;if(run>best)best=run;}if(st==='miss'){due++;run=0;}}
  var rate=due?Math.round(done/due*100):100, p=planFor(g,cycleEnd(g)), nd=p.days.length;
  var title=rate===100?'全勤！说到做到 🎉':rate>=80?'做到了 '+rate+'%，很稳 👏':rate>=50?'坚持了 '+done+' 天，比开始时强':'这一期没跑顺，没关系';
  var lead=rate>=80?'这 4 周你真的每天都在做。习惯已经开始长出来了。':rate>=50?'一半以上的日子你都做到了。下一期把计划调轻一点，会更顺。':'计划可能定得太满了。这不是你不行，是计划需要更贴合你的生活。';
  var tip=rate>=80?'':'<div class="card tint small"><b>下一期建议</b><div style="margin-top:4px">'+(nd>3?'把每周练习从 '+nd+' 天减到 '+Math.max(3,nd-2)+' 天，':'')+'把每天的任务量减半。小一点、但每天都做到，比大计划更有用。</div></div>';
  $app.innerHTML=top()+'<div class="hero-ic"'+(rate>=80?'':' style="background:var(--sky)"')+'>'+LOGO_W+'</div><h1 style="margin-bottom:6px">'+title+'</h1>'+
  '<p class="muted" style="margin:0 0 14px">'+lead+'</p>'+
  '<div class="card"><div class="kv"><span>完成率</span><b>'+rate+'%（'+done+'/'+due+' 天）</b></div><div class="kv"><span>最长连续</span><b>'+best+' 天</b></div><div class="kv"><span>'+(g.pay==='prepay'?'退回给你':'承诺金未扣')+'</span><b>'+money(g.stake-T.charged)+'</b></div><div class="kv"><span>捐给慈善</span><b>'+money(T.charged)+'</b></div></div>'+
  (T.charged>0?'<p class="small muted" style="margin:0 0 14px">这 '+money(T.charged)+' 已全部捐给 '+esc(charityName(g))+'，平台不留一分。谢谢你，这也是一件好事。</p>':'')+
  tip+
  (g.type==='pte'?'<div class="card tint small">考完记得告诉我们分数。你的提分故事会帮到下一个人。</div>':'')+
  '<button class="btn block" id="shareRes" style="margin-bottom:10px">分享我的成绩</button>'+
  '<button class="btn primary block" id="again">'+(rate>=80?'用同样的计划再开一期':'按建议调轻，再开一期')+'</button>';
  document.getElementById('tabs').classList.add('hide'); bindTop();
  document.getElementById('shareRes').onclick=function(){var tx=shareText(g,rate,done,due,best,T.charged),b=this;
    function okMsg(){b.textContent='已复制，去发给朋友吧 ✓';setTimeout(function(){b.textContent='分享我的成绩';},2500);}
    if(navigator.share){navigator.share({title:'Enoogh 一诺',text:tx}).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(tx).then(okMsg,function(){window.prompt('复制这段文字分享：',tx);});}
    else{window.prompt('复制这段文字分享：',tx);}};
  document.getElementById('again').onclick=function(){var old=S.goal;S.history.push({name:old.name,rate:rate,charged:T.charged,end:old.finished});S.goal=null;S.draft=nextDraft(old,rate);save();render();window.scrollTo(0,0);};
}

render();
})();
</script>
</body>
</html>
