.logo{flex:none}

.hide{display:none!important}

/* 浏览器存储一般只有 5MB 左右，录音和照片很快会占满。满了先清掉旧的证据（打卡记录本身保留），保证今天的打卡一定能存上 */
function pruneMedia(st,keep){var n=0,t=today(),gs=[st.goal].concat((st.history||[]).map(function(h){return h.goal;})).filter(Boolean);
  gs.forEach(function(g){Object.keys(g.days||{}).forEach(function(k){var r=g.days[k];if(((r.photos&&r.photos.length)||r.audio)&&diffDays(fromKey(k),t)>keep){r.photos=[];r.audio=null;r.mediaPruned=true;n++;}});});return n;}
function save(){var tx=JSON.stringify(S);try{localStorage.setItem(KEY,tx);return;}catch(e){}
  var steps=[14,7,3,1,0];for(var i=0;i<steps.length;i++){if(!pruneMedia(S,steps[i]))continue;try{localStorage.setItem(KEY,JSON.stringify(S));toast('手机存储快满了，已清掉 '+steps[i]+' 天前的打卡照片和录音（打卡记录都在）');return;}catch(e){}}

/* ---------- dates (local, with demo offset) ---------- */
function realToday(){var d=new Date();d.setHours(0,0,0,0);return d;}
function today(){return addDays(realToday(),S.offset);}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function pad(n){return n<10?'0'+n:''+n;}
function diffDays(a,b){return Math.round((b-a)/864e5);}
function fmt(d){return (d.getMonth()+1)+'月'+d.getDate()+'日';}  // 中文日期，避免 D/M 与 M/D 混淆
function fmtLong(d){return fmt(d)+' '+WD[d.getDay()];}
function money(n){return '$'+(Math.round(n*100)/100).toLocaleString('en-AU',{minimumFractionDigits:0,maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------- goal model ---------- */
function planFor(goal,d){ // plan in force on date d
  var w=weekIndex(goal,d); var p=goal.plans[0].plan;
  for(var i=0;i<goal.plans.length;i++){if(goal.plans[i].fromWeek<=w)p=goal.plans[i].plan;}
  return p;
}
function weekIndex(goal,d){return Math.floor(diffDays(fromKey(goal.start),d)/7);}
function isPracticeDay(goal,d){var p=planFor(goal,d);return p.days.indexOf(d.getDay())>=0;}
function cycleEnd(goal){return addDays(fromKey(goal.start),CYCLE_DAYS-1);}
function inCycle(goal,d){var i=diffDays(fromKey(goal.start),d);return i>=0&&i<CYCLE_DAYS;}
function rec(goal,k){return goal.days[k]||(goal.days[k]={});}
/* 早睡/戒奶茶：判断要到第二天才算数，昨天的卡可在次日中午 12 点前补打 */
var GRACE_HOUR={sleep:12,milktea:12};
/* 没法拍照证明的目标：用一句诚信承诺代替照片 */
var PLEDGE={milktea:'我保证今天一杯奶茶都没喝。'};
function graceOpen(goal,d){var h=GRACE_HOUR[goal.tpl];return !!h&&diffDays(d,today())===1&&new Date().getHours()<h;}
var lateMode=false;
function shownDay(){var g=S.goal,y=addDays(today(),-1);return lateMode&&g&&dayStatus(g,y)==='late'?y:today();}
function dayStatus(goal,d){
  var k=key(d), t=today();
  if(!inCycle(goal,d))return 'out';
  if(!isPracticeDay(goal,d))return 'rest';
  var r=goal.days[k]||{};
  if(r.done)return 'done';
  if(r.excused)return 'excused';
  if(diffDays(d,t)>0)return graceOpen(goal,d)?'late':'miss';
  if(diffDays(d,t)===0)return 'todo';
  return 'future';
}
function perMiss(goal){return goal.stake/20;}
function practiceDaysTotal(goal){var n=0;for(var i=0;i<CYCLE_DAYS;i++){if(isPracticeDay(goal,addDays(fromKey(goal.start),i)))n++;}return n;}

/* settle: misses become pending deductions; pending older than 24h are charged on Sundays (weekly batch) */
function settle(){
  var g=S.goal; if(!g||g.finished)return;
  var t=today(), start=fromKey(g.start);
  for(var i=0;i<CYCLE_DAYS;i++){
    var d=addDays(start,i); if(diffDays(d,t)<=0)break;
    if(dayStatus(g,d)==='miss'){
      var k=key(d); if(!g.ledger.some(function(l){return l.day===k;})){
        var already=g.ledger.reduce(function(s,l){return s+(l.status==='void'?0:l.amt);},0);
        var amt=Math.max(0,Math.min(perMiss(g),g.stake-already));
        g.ledger.push({day:k,amt:amt,status:amt>0?'pending':'void',noticed:key(addDays(d,1))});
      }
    }
  }
  // weekly batch on Sunday: charge pending items whose 24h notice has passed
  g.ledger.forEach(function(l){
    if(l.status!=='pending')return;
    var nd=fromKey(l.noticed), due=nextSunday(addDays(nd,1));
    if(diffDays(due,t)>=0){l.status='charged';l.chargedOn=key(due);}
  });
  if(diffDays(cycleEnd(g),t)>0 && !g.finished && dayStatus(g,cycleEnd(g))!=='late'){
    // final settlement: everything pending is charged at the end
    g.ledger.forEach(function(l){if(l.status==='pending'){l.status='charged';l.chargedOn=key(addDays(cycleEnd(g),1));}});
    g.finished=key(addDays(cycleEnd(g),1));
  }
  save();
}
function nextSunday(d){var x=new Date(d.getTime());while(x.getDay()!==0)x=addDays(x,1);return x;}
function totals(g){
  var charged=0,pending=0;
  g.ledger.forEach(function(l){if(l.status==='charged')charged+=l.amt;if(l.status==='pending')pending+=l.amt;});
  return {charged:charged,pending:pending,left:Math.max(0,g.stake-charged-pending)};
}
function appealsLeft(g){return g.mode==='hard'?0:Math.max(0,2-g.appealsUsed);}

function sheet(html,onMount){
  document.querySelectorAll('.toast').forEach(function(x){x.remove();});
  var bg=document.createElement('div');bg.className='sheet-bg';
  bg.innerHTML='<div class="sheet" role="dialog" aria-modal="true" tabindex="-1" style="outline:none">'+html+'</div>';
  bg.addEventListener('click',function(e){if(e.target===bg)close();});
  var prev=document.activeElement;
  function onKey(e){if(e.key==='Escape')close();}
  function close(){bg.remove();document.removeEventListener('keydown',onKey);if(prev&&prev.focus)try{prev.focus();}catch(e){}}
  document.addEventListener('keydown',onKey);
  document.body.appendChild(bg); if(onMount)onMount(bg.firstChild,close);
  if(bg.firstChild&&bg.firstChild.focus)try{bg.firstChild.focus({preventScroll:true});}catch(e){}
  return close;
}

function newDraft(){return {step:0,type:null,goalName:'',pte:{now:58,target:65,exam:key(addDays(today(),42)),weak:'speaking'},days:[1,2,3,4,5,6],time:'20:00',tasks:[],stake:300,mode:'normal',pay:'card',charity:'amaze',agree:{}};}
function nextDraft(old,rate){ // 再开一期：带上上一期计划；完成率 <80% 时按建议调轻
  var D=newDraft(),p=old.plans[old.plans.length-1].plan,light=rate<80;
  D.step=2;D.type=old.type;D.goalName=old.type==='pte'?'':old.name;
  if(old.pte){D.pte=JSON.parse(JSON.stringify(old.pte));if(D.pte.exam<key(addDays(today(),7)))D.pte.exam=key(addDays(today(),42));}
  D.days=p.days.slice();if(light&&D.days.length>3)D.days=D.days.slice(0,Math.max(3,D.days.length-2));
  D.time=p.time;D.tasks=p.tasks.map(function(t){var c={code:t.code||null,name:t.name,qty:light?Math.max(1,Math.round(t.qty/2)):t.qty,unit:t.unit,mins:t.mins||0};if(!c.code)delete c.code;return c;});
  D.stake=old.stake;D.mode=old.mode;D.pay=old.pay;D.charity=old.charity;D.carried=light?'light':rate>=95?'up':'same';
  return D;
}
function bumpPlan(D){ // 上一期几乎全勤：用户点“加一点”，每项任务量约 +20%（至少 +1）
  D.tasks.forEach(function(t){var q=t.qty,n=q+Math.max(1,Math.round(q*0.2));if(!t.code&&t.mins)t.mins=Math.round(t.mins*n/q);t.qty=n;});
  D.carried='upped';return D;
}
function appealDays(g){var seen={},out=[];g.ledger.forEach(function(l){if(l.status==='pending'&&!seen[l.day]){seen[l.day]=1;out.push(l);}});return out.sort(function(a,b){return a.day<b.day?1:-1;});}

/* 加到手机日历：生成 .ics，按本周计划的练习日和提醒时间每周重复到结营，开始时手机会提醒 */
function icsText(g,t){
  var p=planFor(g,t),BD=['SU','MO','TU','WE','TH','FR','SA'],tm=(p.time||'20:00').split(':'),first=null;
  for(var i=0;i<7;i++){var d=addDays(t,i);if(p.days.indexOf(d.getDay())>=0){first=d;break;}}
  if(!first||!p.days.length)return '';
  var ymd=function(d){return key(d).replace(/-/g,'');}, end=cycleEnd(g);
  var esc1=function(v){return String(v).replace(/\\/g,'\\\\').replace(/[,;]/g,function(c){return '\\'+c;}).replace(/\r?\n/g,'\\n');};
  var desc=p.tasks.map(function(x){return esc1(x.name+' '+x.qty+' '+x.unit);}).join('\\n')+'\\n做完回 enoogh.com 打卡'+(GRACE_HOUR[g.tpl]?'，最晚第二天中午 12 点。':'，23:59 截止。');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Enoogh//CN','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:enoogh-'+g.id+'-'+key(t)+'@enoogh.com','DTSTAMP:'+ymd(t)+'T000000Z',
    'DTSTART:'+ymd(first)+'T'+pad(+tm[0])+pad(+tm[1])+'00','DURATION:PT30M',
    'RRULE:FREQ=WEEKLY;BYDAY='+p.days.map(function(d){return BD[d];}).join(',')+';UNTIL='+ymd(end)+'T235959',
    'SUMMARY:一诺打卡：'+esc1(g.name),'DESCRIPTION:'+desc,
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:该练了','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].map(icsFold).join('\r\n');
}
/* 日历标准要求每行不超过 75 字节，超出要折行（中文 3 字节，不能拆开一个字） */
function icsFold(line){var out='',n=0,cs=Array.from(line);for(var i=0;i<cs.length;i++){var c=cs[i],b=encodeURIComponent(c).replace(/%../g,'x').length;if(n+b>(out?74:75)){out+='\r\n ';n=0;}out+=c;n+=b;}return out;}
/* 本期日历：28 天一眼看完，哪天做到、漏了、报备、休息 */
function cycleCal(g){var st0=fromKey(g.start),t=today(),ic={done:'✓',miss:'✕',excused:'假',rest:'休',todo:'·',late:'?',future:'',out:''},lb={done:'完成',miss:'漏练',excused:'已申诉',rest:'休息',todo:'今天',late:'待补打卡',future:'',out:''};
  var head='<div class="week cal-h">'+[0,1,2,3,4,5,6].map(function(i){return '<div class="small muted" style="text-align:center">'+WD[addDays(st0,i).getDay()].slice(1)+'</div>';}).join('')+'</div>';
  var h='';for(var w=0;w<4;w++){h+='<div class="week">';for(var i=0;i<7;i++){var d=addDays(st0,w*7+i),st=dayStatus(g,d),cls={done:'done',miss:'miss',excused:'excused',rest:'rest'}[st]||'';
    h+='<div class="day '+cls+(diffDays(d,t)===0?' today':'')+'" aria-label="'+fmt(d)+' '+(lb[st]||'')+'"><span style="font-size:11px">'+(d.getMonth()+1)+'/'+d.getDate()+'</span><b>'+(ic[st]||'&nbsp;')+'</b></div>';}h+='</div>';}
  return '<div class="card"><div class="row between"><h2 style="margin:0">本期日历</h2><span class="chip grey">'+fmt(st0)+' – '+fmt(cycleEnd(g))+'</span></div>'+head+h+'</div>';}

    ['什么时候扣、扣多少？','漏练一天扣承诺金的 1/20（你是 '+money(perMiss(g))+'）。第二天先通知你，满 24 小时后'+(g.pay==='prepay'?'，在周日从你预付的承诺金里合并扣一次；结营后 3 个工作日内把剩下的退给你。':'，在周日合并扣一次；最多扣到承诺金为止。')],
    ['生病或有急事怎么办？','普通模式每期有 2 次机会：当天点「报备」，或漏练后在待扣款卡上「申诉」，通过就不扣。硬核模式不能申诉。'],
    ['现在会真的扣钱吗？','不会。现在是演示版，不连接任何付款。']
  ].map(function(q){return '<details><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>';}).join('')+'</div>';
  if(S.history&&S.history.length){var tot=S.history.reduce(function(x,y){return x+(+y.charged||0);},0);
    h+='<div class="card"><div class="row between"><h3 style="margin:0">以前的几期</h3>'+(tot?'<span class="chip brand">累计捐出 '+money(tot)+'</span>':'')+'</div>'+S.history.slice(-6).reverse().map(function(x){return '<div class="kv wrapk"><span>'+esc(x.name||'')+(x.end?' <span class="small muted">· '+fmt(fromKey(x.end))+' 结营</span>':'')+'</span><b>'+(+x.rate||0)+'%'+(x.charged?' · 捐 '+money(x.charged):'')+'</b></div>';}).join('')+'</div>';}
  h+='<div class="card"><h3 style="margin:0 0 6px">备份</h3><p class="small muted" style="margin:0 0 12px">你的计划、打卡和照片只存在这台设备的浏览器里。换手机或清理浏览器前，先导出一份。</p><div class="row"><button class="btn soft" style="flex:1" id="bkOut">导出备份</button><button class="btn ghost" style="flex:1" id="bkIn">从备份恢复</button></div></div>';
  h+='<button class="btn danger block" id="resetAll">删除这一期（演示用）</button>';
  return h;
}
function bindMoney(){on('#bkOut','click',exportBackup);on('#bkIn','click',importBackup);on('#resetAll','click',function(){var b=this;if(!b.dataset.sure){b.dataset.sure='1';b.textContent='再点一次确认删除';return;}S=blank();save();render();toast('已清空，重新开始');});}

/* finished */
function charityName(g){var c=CHARITIES.filter(function(x){return x.id===g.charity;})[0]||CHARITIES[0];return c.name;}
function shareCard(g,rate,done,due,best,charged){ // 结营成绩图片卡：完成率圆环 + 连续天数 + 捐款，适合发朋友圈
  var W=750,H=1000,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext&&c.getContext('2d');if(!x)return null;
  var F='"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif';
  var bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#EAF6F4');bg.addColorStop(1,'#FFFFFF');x.fillStyle=bg;x.fillRect(0,0,W,H);
  x.fillStyle='#fff';x.shadowColor='rgba(18,38,44,.08)';x.shadowBlur=40;x.shadowOffsetY=12;
  x.beginPath();if(x.roundRect)x.roundRect(48,96,W-96,H-200,40);else x.rect(48,96,W-96,H-200);x.fill();x.shadowColor='transparent';
  x.textAlign='center';x.fillStyle='#5A6B70';x.font='500 26px '+F;x.fillText(g.type==='pte'?'PTE 备考 · 4 周':(g.name||'我的目标')+' · 4 周',W/2,170);
  var cx=W/2,cy=380,R=150;x.lineCap='round';x.lineWidth=26;x.strokeStyle='#E2ECEA';x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.stroke();
  if(rate>0){x.strokeStyle=rate>=80?'#0E9C8C':'#4AA3E0';x.beginPath();x.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(rate,100)/100);x.stroke();}
  x.fillStyle='#12262C';x.font='700 96px '+F;x.fillText(rate+'%',cx,cy+30);x.fillStyle='#5A6B70';x.font='26px '+F;x.fillText('完成率',cx,cy+78);
  var cols=[[done+'/'+due,'做到的天数'],[best+' 天','最长连续'],[charged>0?money(charged):'$0','捐给慈善']];
  cols.forEach(function(k,i){var px=48+(W-96)/6*(2*i+1);x.fillStyle='#12262C';x.font='700 42px '+F;x.fillText(k[0],px,660);x.fillStyle='#5A6B70';x.font='24px '+F;x.fillText(k[1],px,700);});
  x.strokeStyle='#E2ECEA';x.lineWidth=2;x.beginPath();x.moveTo(96,760);x.lineTo(W-96,760);x.stroke();
  x.fillStyle='#0A7A6E';x.font='600 30px '+F;x.fillText(rate===100?'全勤，说到做到。':rate>=80?'这 4 周，我几乎每天都在做。':'坚持了 '+done+' 天，下一期继续。',W/2,820);
  if(charged>0){x.fillStyle='#5A6B70';x.font='22px '+F;x.fillText('漏练扣下的钱已全部捐给 '+charityName(g),W/2,860);}
  x.fillStyle='#0E9C8C';x.font='700 30px '+F;x.fillText('Enoogh 一诺',W/2,H-50);x.fillStyle='#5A6B70';x.font='22px '+F;x.fillText('enoogh.com · 说到做到',W/2,H-18);
  return c;}
function renderFinished(){
  var g=S.goal,T=totals(g),start=fromKey(g.start),done=0,due=0,run=0,best=0;
  for(var i=0;i<CYCLE_DAYS;i++){var st=dayStatus(g,addDays(start,i));if(st==='done'){done++;due++;run++;if(run>best)best=run;}if(st==='miss'){due++;run=0;}}
  var rate=due?Math.round(done/due*100):100, p=planFor(g,cycleEnd(g)), nd=p.days.length;
  var title=rate===100?'全勤！说到做到 🎉':rate>=80?'做到了 '+rate+'%，很稳 👏':rate>=50?'做到了 '+rate+'%，坚持了 '+done+' 天':'这一期没跑顺，没关系';
  var lead=rate>=95?'这 4 周你真的每天都在做。习惯已经开始长出来了。':rate>=80?'大多数日子你都做到了，偶尔漏一两天很正常。习惯已经开始长出来了。':rate>=50?'一半以上的日子你都做到了。下一期把计划调轻一点，会更顺。':'计划可能定得太满了。这不是你不行，是计划需要更贴合你的生活。';
  var tip=rate>=95?'<div class="card tint small"><b>下一期建议</b><div style="margin-top:4px">你已经很稳了。下一期可以每项加一点（约 20%），再开一期时一键就能加。</div></div>':rate>=80?'':'<div class="card tint small"><b>下一期建议</b><div style="margin-top:4px">'+(nd>3?'把每周练习从 '+nd+' 天减到 '+Math.max(3,nd-2)+' 天，':'')+'把每天的任务量减半。小一点、但每天都做到，比大计划更有用。</div></div>';
  $app.innerHTML=top()+'<div class="hero-ic"'+(rate>=80?'':' style="background:var(--sky)"')+'>'+LOGO_W+'</div><h1 style="margin-bottom:6px">'+title+'</h1>'+
  '<p class="muted" style="margin:0 0 14px">'+lead+'</p>'+
  '<div class="card"><div class="kv"><span>完成率</span><b>'+rate+'%（'+done+'/'+due+' 天）</b></div><div class="kv"><span>最长连续</span><b>'+best+' 天</b></div><div class="kv"><span>'+(g.pay==='prepay'?'退回给你':'承诺金未扣')+'</span><b>'+money(g.stake-T.charged)+'</b></div><div class="kv"><span>捐给慈善</span><b>'+money(T.charged)+'</b></div></div>'+
  (T.charged>0?'<p class="small muted" style="margin:0 0 14px">这 '+money(T.charged)+' 已全部捐给 '+esc(charityName(g))+'，平台不留一分。谢谢你，这也是一件好事。</p>':'')+
  tip+
  (g.type==='pte'?'<div class="card tint small">考完记得告诉我们分数。你的提分故事会帮到下一个人。</div>':'')+
  '<div class="row" style="margin-bottom:10px"><button class="btn block" id="shareImg" style="flex:1">生成成绩图片</button><button class="btn ghost" id="shareRes" style="flex:1">复制文字</button></div>'+
  '<button class="btn primary block" id="again">'+(rate>=80?'用同样的计划再开一期':'按建议调轻，再开一期')+'</button>'+
  '<button class="btn ghost block" id="newGoal" style="margin-top:10px">换一个目标</button>';
  document.getElementById('tabs').classList.add('hide'); bindTop();
  document.getElementById('shareRes').onclick=function(){var tx=shareText(g,rate,done,due,best,T.charged),b=this;
    function okMsg(){b.textContent='已复制，去发给朋友吧 ✓';setTimeout(function(){b.textContent='复制文字';},2500);}
    if(navigator.share){navigator.share({title:'Enoogh 一诺',text:tx}).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(tx).then(okMsg,function(){window.prompt('复制这段文字分享：',tx);});}
    else{window.prompt('复制这段文字分享：',tx);}};
  document.getElementById('shareImg').onclick=function(){var cv=shareCard(g,rate,done,due,best,T.charged);if(!cv||!cv.toDataURL){toast('这个浏览器不支持生成图片，请用“复制文字”');return;}var url=cv.toDataURL('image/png');
    sheet('<h2 style="margin-top:0">成绩图片</h2><img src="'+url+'" alt="成绩图片" style="width:100%;border-radius:14px;border:1px solid var(--line)"><p class="small muted" style="text-align:center;margin:10px 0">手机上长按图片即可保存或发给朋友</p><a class="btn primary block" download="enoogh-成绩.png" href="'+url+'">保存图片</a>');};
  document.getElementById('again').onclick=function(){var old=S.goal;S.history.push({name:old.name,rate:rate,charged:T.charged,end:old.finished});S.goal=null;S.draft=nextDraft(old,rate);save();render();window.scrollTo(0,0);};
  document.getElementById('newGoal').onclick=function(){var old=S.goal;S.history.push({name:old.name,rate:rate,charged:T.charged,end:old.finished});S.goal=null;S.draft=newDraft();S.draft.step=1;save();render();window.scrollTo(0,0);};
}
